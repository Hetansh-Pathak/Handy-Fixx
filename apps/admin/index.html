<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      // Set the theme before the first paint (no white flash): saved choice, else the computer's setting.
      try {
        var t = localStorage.getItem("apnabanda.admin.theme");
        if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>apnabanda Admin — Operations Panel</title>
    <meta name="description" content="apnabanda internal admin panel. Manage providers, bookings, KYC review and platform operations." />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
